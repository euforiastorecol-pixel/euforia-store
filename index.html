<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euforia Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #ffffff; color: #2d2d2d; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .product-card-container { perspective: 1000px; }
        .product-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .product-card-container:hover .product-card-inner, .product-card-container.touch-flip .product-card-inner { transform: rotateY(180deg); }
        .product-card-front, .product-card-back { backface-visibility: hidden; }
        .product-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Franja Superior -->
    <div class="bg-[#FFDAB9] text-gray-900 text-xs sm:text-sm font-medium py-2 px-4 text-center tracking-wide">
        El aroma perfecto para tu piel, en un click. Envíos a toda Colombia
    </div>

    <!-- Cabecera -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img id="store-logo" src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=150" alt="Logo" class="h-12 w-12 object-cover rounded-full border border-[#FFDAB9] shadow-inner store-logo">
                <span class="text-2xl sm:text-3xl font-bold tracking-wider font-serif text-gray-900">Euforia Store</span>
            </div>
            <div class="flex items-center space-x-4">
                <select id="currency-selector" onchange="changeCurrency()" class="bg-gray-50 border border-gray-200 text-xs sm:text-sm rounded-lg px-2 py-1.5 focus:outline-none">
                    <option value="COP">COP ($)</option>
                    <option value="USD">USD ($)</option>
                </select>
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 hover:text-orange-500 transition">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-[#FFDAB9] text-gray-900 font-bold text-[10px] h-5 w-5 rounded-full flex items-center justify-center shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Principal -->
    <section class="relative w-full bg-gray-100 overflow-hidden shadow-inner">
        <div id="carousel-container" class="relative w-full h-[320px] sm:h-[420px] md:h-[480px]"></div>
        <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white p-2 rounded-full transition z-20"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white p-2 rounded-full transition z-20"><i class="fa-solid fa-chevron-right"></i></button>
    </section>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex flex-wrap justify-center gap-2 sm:gap-4 mb-10">
            <button onclick="filterCategory('todos')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-900 text-white shadow">Todos</button>
            <button onclick="filterCategory('dama')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200">Dama</button>
            <button onclick="filterCategory('caballeros')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200">Caballeros</button>
            <button onclick="filterCategory('unisex')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200">Unisex</button>
            <button onclick="filterCategory('cremas corporales')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200">Cremas Corporales</button>
            <button onclick="filterCategory('body spray')" class="cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200">Body Spray</button>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Carrito -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                    <h2 class="text-lg font-bold font-serif">Tu Carrito de Compras</h2>
                    <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
                <div class="p-6 border-t border-gray-100 bg-gray-50 space-y-4">
                    <div class="flex justify-between text-base font-bold">
                        <span>Total:</span>
                        <span id="cart-total">$0</span>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="cust-name" placeholder="Nombre" class="w-full px-3 py-2 border rounded-lg text-sm">
                        <input type="text" id="cust-lastname" placeholder="Apellido" class="w-full px-3 py-2 border rounded-lg text-sm">
                        <input type="text" id="cust-address" placeholder="Dirección de envío" class="w-full px-3 py-2 border rounded-lg text-sm">
                        <select id="cust-payment" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Nequi">Nequi</option>
                            <option value="Davivienda">Davivienda</option>
                        </select>
                    </div>
                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg shadow transition flex items-center justify-center space-x-2">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        <span>Finalizar Compra por WhatsApp</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de Página -->
    <footer class="bg-gray-900 text-white py-10 mt-16 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <span class="text-xl font-bold font-serif">Euforia Store</span>
            <p class="text-xs text-gray-400 mt-1">El aroma perfecto para tu piel, en un click.</p>
            <div class="flex justify-center space-x-6 text-2xl mt-4">
                <a href="https://www.tiktok.com/@euforia.store.col" target="_blank" class="hover:text-[#FFDAB9]"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.instagram.com/euforia_store_col" target="_blank" class="hover:text-[#FFDAB9]"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <!-- AQUÍ ESTÁN TUS PRODUCTOS Y BANNERS: Modifícalos aquí mismo en el código cuando quieras actualizar la tienda -->
    <script>
        const STORE_DATA = {
            logo: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=150",
            banners: [
                { img: "https://images.unsplash.com/photo-1615397349754-cfa2066a298e?w=1200", title: "Descubre tu esencia ideal" },
                { img: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?w=1200", title: "Elegancia y frescura natural" },
                { img: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=1200", title: "Cremas y Body Sprays exclusivos" }
            ],
            products: [
                { id: "demo1", name: "Perfume Rose Elegance", category: "dama", priceCOP: 180000, priceUSD: 45.00, desc: "Notas florales y avainilladas de larga duración.", img1: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400", img2: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400" },
                { id: "demo2", name: "Blue Intense Man", category: "caballeros", priceCOP: 195000, priceUSD: 48.75, desc: "Aroma amaderado fresco y elegante.", img1: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?w=400", img2: "https://images.unsplash.com/photo-1615397349754-cfa2066a298e?w=400" },
                { id: "demo3", name: "Crema Corporal Velvet", category: "cremas corporales", priceCOP: 75000, priceUSD: 18.75, desc: "Hidratación profunda con aroma delicado.", img1: "https://images.unsplash.com/photo-1608248597359-f5383a15ef0b?w=400", img2: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400" },
                { id: "demo4", name: "Body Spray Summer Splash", category: "body spray", priceCOP: 60000, priceUSD: 15.00, desc: "Frescura cítrica para todo el día.", img1: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400", img2: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400" }
            ]
        };

        let currentCurrency = 'COP';
        let cart = [];
        let currentCategory = 'todos';
        let currentSlideIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (STORE_DATA.logo) {
                document.querySelectorAll('.store-logo').forEach(img => img.src = STORE_DATA.logo);
            }
            renderCarousel();
            renderProducts();
        });

        function renderCarousel() {
            const container = document.getElementById('carousel-container');
            if (!container || !STORE_DATA.banners) return;
            container.innerHTML = STORE_DATA.banners.map((b, idx) => `
                <div class="absolute inset-0 transition-opacity duration-1000 ${idx === currentSlideIndex ? 'opacity-100 z-10' : 'opacity-0 z-0'}">
                    <img src="${b.img}" alt="Banner ${idx+1}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-start px-8 sm:px-16 md:px-24">
                        <h2 class="text-white text-3xl sm:text-5xl font-serif font-bold text-left drop-shadow-lg max-w-xl">${b.title}</h2>
                    </div>
                </div>
            `).join('');
        }

        function nextSlide() {
            if (!STORE_DATA.banners) return;
            currentSlideIndex = (currentSlideIndex + 1) % STORE_DATA.banners.length;
            renderCarousel();
        }

        function prevSlide() {
            if (!STORE_DATA.banners) return;
            currentSlideIndex = (currentSlideIndex - 1 + STORE_DATA.banners.length) % STORE_DATA.banners.length;
            renderCarousel();
        }

        setInterval(nextSlide, 5000);

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if(!STORE_DATA.products) return;
            const filtered = currentCategory === 'todos' ? STORE_DATA.products : STORE_DATA.products.filter(p => p.category === currentCategory);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No hay productos en esta categoría.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                let priceFormatted = currentCurrency === 'COP' 
                    ? `$ ${Number(p.priceCOP).toLocaleString('es-CO')} COP` 
                    : `$ ${Number(p.priceUSD || (p.priceCOP / 4000)).toFixed(2)} USD`;

                let img2Html = p.img2 ? `<img src="${p.img2}" alt="${p.name}" class="w-full h-64 object-cover">` : `<img src="${p.img1}" alt="${p.name}" class="w-full h-64 object-cover">`;

                return `
                    <div class="product-card-container bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden flex flex-col justify-between h-96 cursor-pointer" onclick="this.classList.toggle('touch-flip')">
                        <div class="product-card-inner relative w-full h-64">
                            <div class="product-card-front absolute inset-0 w-full h-full bg-gray-50">
                                <img src="${p.img1}" alt="${p.name}" class="w-full h-full object-cover">
                            </div>
                            <div class="product-card-back absolute inset-0 w-full h-full bg-gray-50">
                                ${img2Html}
                            </div>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-grow">
                            <div>
                                <span class="text-[10px] uppercase tracking-wider text-orange-500 font-semibold">${p.category}</span>
                                <h3 class="font-serif font-bold text-gray-900 text-base truncate">${p.name}</h3>
                                <p class="text-xs text-gray-500 line-clamp-1 mt-0.5">${p.desc || ''}</p>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="font-bold text-gray-900 text-sm">${priceFormatted}</span>
                                <button onclick="event.stopPropagation(); addToCart('${p.id}')" class="bg-gray-900 hover:bg-orange-500 text-white text-xs px-3 py-1.5 rounded-lg transition">Agregar</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.0 && btn.classList.remove('bg-gray-900', 'text-white', 'shadow');
                btn.className = 'cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200';
                if(btn.textContent.toLowerCase().includes(cat) || (cat === 'todos' && btn.textContent === 'Todos')) {
                    btn.className = 'cat-btn px-5 py-2 rounded-full text-sm font-medium transition bg-gray-900 text-white shadow';
                }
            });
            renderProducts();
        }

        function changeCurrency() {
            currentCurrency = document.getElementById('currency-selector').value;
            renderProducts();
            renderCart();
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
            renderCart();
        }

        function addToCart(id) {
            const prod = STORE_DATA.products.find(p => p.id === id);
            if(!prod) return;
            const existing = cart.find(item => item.id === id);
            if(existing) { existing.qty++; } else { cart.push({ ...prod, qty: 1 }); }
            updateCartBadge();
            toggleCart();
        }

        function updateCartBadge() {
            document.getElementById('cart-badge').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-8 text-sm">Tu carrito está vacío</p>`;
                document.getElementById('cart-total').textContent = currentCurrency === 'COP' ? '$0 COP' : '$0.00 USD';
                return;
            }
            let totalCOP = 0, totalUSD = 0;
            container.innerHTML = cart.map((item, idx) => {
                let subCOP = item.priceCOP * item.qty;
                let subUSD = (item.priceUSD || (item.priceCOP / 4000)) * item.qty;
                totalCOP += subCOP; totalUSD += subUSD;
                let priceDisplay = currentCurrency === 'COP' ? `$${subCOP.toLocaleString('es-CO')} COP` : `$${subUSD.toFixed(2)} USD`;
                return `
                    <div class="flex items-center justify-between border-b pb-3">
                        <div class="flex items-center space-x-3">
                            <img src="${item.img1}" class="w-12 h-12 object-cover rounded-lg">
                            <div><h4 class="text-sm font-bold">${item.name}</h4><p class="text-xs text-gray-500">Cant: ${item.qty}</p></div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold">${priceDisplay}</span>
                            <button onclick="removeFromCart(${idx})" class="text-red-500 text-xs block mt-1 hover:underline">Eliminar</button>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('cart-total').textContent = currentCurrency === 'COP' ? `$${totalCOP.toLocaleString('es-CO')} COP` : `$${totalUSD.toFixed(2)} USD`;
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCartBadge();
            renderCart();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) { alert("Agrega productos al carrito."); return; }
            const name = document.getElementById('cust-name').value.trim();
            const lastname = document.getElementById('cust-lastname').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const payment = document.getElementById('cust-payment').value;
            if(!name || !lastname || !address) { alert("Completa nombre, apellido y dirección."); return; }

            let text = `*¡Hola Euforia Store!* Pedido:%0AClient: ${name} ${lastname}%0ADir: ${address}%0APago: ${payment}%0A%0A`;
            let total = 0;
            cart.forEach(item => {
                text += `• ${item.qty}x ${item.name} ($${(item.priceCOP * item.qty).toLocaleString('es-CO')} COP)%0A`;
                total += item.priceCOP * item.qty;
            });
            text += `%0A*Total:* $${total.toLocaleString('es-CO')} COP`;
            window.open(`https://wa.me/573508860602?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
